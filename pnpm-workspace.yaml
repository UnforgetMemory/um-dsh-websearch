# pnpm ≥10 reads project settings from this file; the legacy `pnpm` key in
# package.json is ignored. Keeps the dependency-family pins (see
# .um.agents/constraints/hardcode-index.md) effective for transitive resolution.
#
# ADR-0007: single-track DSH 0.2.0-rc.2 (the Desktop install). The family pins
# EXACTLY, matching the official 0.2.0-rc.2 packages; cordis rides the loader's
# volatile machinery, so ~4.0.4; schemastery must carry `.volatile()` (3.18.4).
overrides:
  '@deepseek-ai/cordis': 4.0.4
  '@deepseek-ai/dsh-credentials': 0.2.0-rc.2
  '@deepseek-ai/dsh-launch-environment': 0.2.0-rc.2
  '@deepseek-ai/dsh-llm': 0.2.0-rc.2
  '@deepseek-ai/dsh-web': 0.2.0-rc.2
  '@deepseek-ai/dsh-web-search-deepseek': 0.2.0-rc.2
  '@deepseek-ai/schemastery': 3.18.4
# pnpm-managed: whitelists the just-published 0.2.0-rc.2 family from the
# minimumReleaseAge gate so installs stay reproducible.
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent@0.2.0-rc.2'
  - '@deepseek-ai/dsh-api-remotes@0.2.0-rc.2'
  - '@deepseek-ai/dsh-brand@0.2.0-rc.2'
  - '@deepseek-ai/dsh-client-locale@0.2.0-rc.2'
  - '@deepseek-ai/dsh-client-ui-plugin-manager@0.2.0-rc.2'
