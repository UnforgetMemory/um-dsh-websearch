<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="um-dsh-websearch — Exa web search for DeepSeek Harness">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#121821"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d9fff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4d9fff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#4d9fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <circle cx="600" cy="128" r="130" fill="url(#glow)"/>

  <g stroke-linecap="round">
    <circle cx="600" cy="112" r="34" fill="none" stroke="url(#accent)" stroke-width="6"/>
    <line x1="626" y1="138" x2="652" y2="164" stroke="url(#accent)" stroke-width="9"/>
  </g>

  <text x="600" y="224" text-anchor="middle" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="46" font-weight="700" fill="#e6edf3" letter-spacing="-0.5">um-dsh-websearch</text>
  <text x="600" y="258" text-anchor="middle" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="500" fill="#a8a8b4">Exa web search · DeepSeek Harness plugin</text>
  <text x="600" y="284" text-anchor="middle" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#70707e">简体中文 · English</text>
</svg>
