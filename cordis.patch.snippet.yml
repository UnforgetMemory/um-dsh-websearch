# 插入到 C:\Users\um\.dsh\profiles\web\cordis.patch.yml（顶层列表追加）
#
# 本文件是"全新安装"的出厂模板（0.4.0：enabled 总开关默认 false，休眠挂载；
# Exa 后端默认启用且优先，Parallel 后端默认关闭）。
# 当前部署的实际状态以 profile 内 cordis.patch.yml 为准。

# 1) 注册插件（出厂休眠：enabled 默认 false）
- insert:
    - id: web-search-exa
      name: um-dsh-websearch

# （可选）2) 启用 Parallel 后端并调整策略：
