earch-input&quot; type=&quot;number&quot; value=&quot;5&quot; disabled=&quot;false&quot;&gt;&lt;p class=&quot;um-dsh-websearch-hint&quot;&gt;搜索未指定条数时的默认值。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;um-dsh-websearch-field&quot;&gt;&lt;label class=&quot;um-dsh-websearch-fhead&quot;&gt;&lt;span class=&quot;um-dsh-websearch-flabel&quot;&gt;检索类型&lt;/span&gt;&lt;/label&gt;&lt;select class=&quot;um-dsh-websearch-input&quot; value=&quot;auto&quot; disabled=&quot;false&quot;&gt;&lt;option key=&quot;auto&quot; value=&quot;auto&quot;&gt;auto&lt;/option&gt;&lt;option key=&quot;neural&quot; value=&quot;neural&quot;&gt;neural&lt;/option&gt;&lt;option key=&quot;keyword&quot; value=&quot;keyword&quot;&gt;keyword&lt;/option&gt;&lt;/select&gt;&lt;p class=&quot;um-dsh-websearch-hint&quot;&gt;auto / neural / keyword（仅 REST）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;um-dsh-websearch-field&quot;&gt;&lt;label class=&quot;um-dsh-websearch-fhead&quot;&gt;&lt;span class=&quot;um-dsh-websearch-flabel&quot;&gt;API 密钥&lt;/span&gt;&lt;/label&gt;&lt;div class=&quot;um-dsh-websearch-panel&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;um-dsh-websearch-addKey&quot; disabled=&quot;false&quot;&gt;添加密钥&lt;/button&gt;&lt;div class=&quot;um-dsh-websearch-keyRow&quot;&gt;&lt;div class=&quot;um-dsh-websearch-keyHead&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;um-dsh-websearch-keyToggle&quot; aria-expanded=&quot;false&quot; aria-label=&quot;展开: UM_WS_EXA_API_KEY&quot;&gt;&lt;span class=&quot;um-dsh-websearch-keyChevron&quot;&gt;▼&lt;/span&gt;&lt;span class=&quot;um-dsh-websearch-keyTitle&quot;&gt;UM_WS_EXA_API_KEY&lt;/span&gt;&lt;span class=&quot;um-dsh-websearch-keyState um-dsh-websearch-keyState-off&quot;&gt;未配置&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;um-dsh-websearch-removeBtn&quot; disabled=&quot;false&quot;&gt;移除&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;um-dsh-websearch-hint&quot;&gt;密钥值经官方 DSH 凭据库写入（引用名自动生成），不落设置文件。&lt;/p&
